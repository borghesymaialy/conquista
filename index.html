<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conquista</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#12151b;color:#e6e8ee;font:15px system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:440px;padding:12px}
h1{font-size:19px;margin:4px 0 10px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9;margin-bottom:6px}
.stato{background:#1b2029;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px;line-height:1.35}
.board{position:relative}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.c{position:relative;aspect-ratio:1;background:#232831;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;cursor:pointer;border:2px solid transparent;user-select:none}
.c.a{background:#1d3d70}.c.b{background:#702a30}
.c.zona{background:#2a3140}
.c.sel{border-color:#fff}.c.vic{border-color:#8fd18f}.c.sc{box-shadow:inset 0 0 0 2px #f0a030}
.c .id{position:absolute;left:4px;bottom:2px;font-size:9px;font-weight:400;opacity:.45}
.c .st{position:absolute;right:4px;bottom:1px;font-size:12px}
.c .o,.c .i{position:absolute;top:2px;font-size:11px;font-weight:600}
.c .o{left:4px;color:#ffb0b0}.c .i{right:4px;color:#b0ffb0}
svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pan{background:#1b2029;border-radius:8px;padding:10px;margin:8px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pan input{width:64px;padding:8px;border-radius:6px;border:1px solid #3a4150;background:#12151b;color:#fff;font-size:16px;text-align:center}
button{background:#2f6fed;color:#fff;border:0;border-radius:8px;padding:9px 13px;font-size:14px;cursor:pointer}
button.s{background:#323a4a}
button:disabled{opacity:.4}
.chip{display:inline-block;background:#2a3140;border-radius:12px;padding:3px 9px;margin:2px;font-size:12px}
.reg{font-size:12.5px;line-height:1.45;max-height:230px;overflow:auto;background:#1b2029;border-radius:8px;padding:8px 10px}
.reg b{display:block;margin-top:6px;opacity:.7}
.reg .r:first-child b{margin-top:0}
.lob input{width:100%;padding:11px;border-radius:8px;border:1px solid #3a4150;background:#12151b;color:#fff;font-size:16px;text-transform:uppercase;margin:8px 0}
.lob button{width:100%;margin:4px 0}
.legenda{font-size:12px;opacity:.65;margin:6px 0}
.c.gain{box-shadow:inset 0 0 0 3px #4ade80}
.c.loss{box-shadow:inset 0 0 0 3px #f87171}
.c .tag{position:absolute;left:50%;top:1px;transform:translateX(-50%);font-size:11px;font-weight:700}
@keyframes lg{0%,100%{box-shadow:inset 0 0 0 3px #4ade80,0 0 0 0 #4ade80;filter:brightness(1)}50%{box-shadow:inset 0 0 0 3px #4ade80,0 0 16px 5px #4ade80;filter:brightness(1.8)}}
@keyframes lp{0%,100%{box-shadow:inset 0 0 0 3px #f87171,0 0 0 0 #f87171;filter:brightness(1)}50%{box-shadow:inset 0 0 0 3px #f87171,0 0 16px 5px #f87171;filter:brightness(1.8)}}
.c.gain.flash{animation:lg .7s ease-in-out 6}
.c.loss.flash{animation:lp .7s ease-in-out 6}
.esito{background:#1b2029;border-left:4px solid #f0a030;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13.5px;line-height:1.5}
.esito .g{color:#4ade80}.esito .p{color:#f87171}
details.how{background:#1b2029;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13.5px;line-height:1.45}
details.how summary{cursor:pointer;font-weight:600}
details.how ol,details.how ul{margin:6px 0;padding-left:20px}
.score{display:flex;gap:6px;margin:6px 0}
.score div{flex:1;border-radius:8px;padding:6px 8px;font-size:12.5px;line-height:1.4}
.score .a{background:#1d3d70}.score .b{background:#702a30}
</style></head><body><div id="app"></div>
<script>
const URL_DB='https://fxnfaotahrlmmrundkib.supabase.co';
const KEY='sb_publishable_P-5jMCC2t_GpKLhwvlosiQ_tIUmUPpW';
const db=supabase.createClient(URL_DB,KEY);
const T='conquista', MAXR=8, TRUPPE=30;
const COL={a:'Blu',b:'Rosso'}, BASE={a:20,b:4};
const nome=i=>String.fromCharCode(65+i%5)+(Math.floor(i/5)+1);
const vicini=i=>{const r=Math.floor(i/5),c=i%5,o=[];if(r>0)o.push(i-5);if(r<4)o.push(i+5);if(c>0)o.push(i-1);if(c<4)o.push(i+1);return o};
const inZona=(p,i)=>p=='a'?Math.floor(i/5)>=3:Math.floor(i/5)<=1;
const somma=a=>a.reduce((x,y)=>x+y,0);

let codice=null,ruolo=null,stato=null,versione=-1,timer=null;
let sel=null,dest=null,n=0,bozza=[],setupBozza=Array(25).fill(0),roundVista=-1;
let flashFino=0,vistoUltimo=null,comeOpen=!localStorage.getItem('conquista:visto');

function nuovoStato(){return{b_presente:false,fase:'setup',round:0,t:{a:Array(25).fill(0),b:Array(25).fill(0)},setup:{a:null,b:null},ordini:{a:null,b:null},ultimo:null,registro:[],vincitore:null,motivo:''}}

/* ---------- rete ---------- */
async function crea(){
  const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c='';for(let i=0;i<4;i++)c+=al[Math.floor(Math.random()*al.length)];
  const{error}=await db.from(T).insert({codice:c,stato:nuovoStato(),versione:0});
  if(error){alert('Errore: '+error.message);return}
  localStorage.setItem('conquista:'+c,'a');entra(c);
}
async function unisci(c){
  c=(c||'').trim().toUpperCase();if(c.length!=4){alert('Il codice ha 4 caratteri');return}
  const{data,error}=await db.from(T).select('*').eq('codice',c).maybeSingle();
  if(error){alert('Errore: '+error.message);return}
  if(!data){alert('Stanza non trovata');return}
  let r=localStorage.getItem('conquista:'+c);
  if(!r){
    if(data.stato.b_presente){alert('Stanza già piena');return}
    const ns=data.stato;ns.b_presente=true;
    const u=await db.from(T).update({stato:ns,versione:data.versione+1}).eq('codice',c).eq('versione',data.versione).select();
    if(!u.data||!u.data.length){alert('Riprova');return}
    r='b';localStorage.setItem('conquista:'+c,'b');
  }
  entra(c);
}
function entra(c){
  codice=c;ruolo=localStorage.getItem('conquista:'+c);versione=-1;vistoUltimo=null;
  history.replaceState(null,'','#'+c);
  db.channel('r'+c).on('postgres_changes',{event:'UPDATE',schema:'public',table:T,filter:'codice=eq.'+c},p=>daRiga(p.new)).subscribe();
  clearInterval(timer);timer=setInterval(carica,4000);carica();
}
async function carica(){
  if(!codice)return;
  const{data}=await db.from(T).select('*').eq('codice',codice).maybeSingle();
  if(data)daRiga(data);
}
function daRiga(r){
  if(r.versione<=versione)return;
  versione=r.versione;stato=r.stato;
  const u=stato.ultimo?stato.ultimo.round:0;
  if(vistoUltimo!==null&&u!==vistoUltimo){flashFino=Date.now()+4500;setTimeout(render,4700)}
  vistoUltimo=u;
  if(stato.round!==roundVista){roundVista=stato.round;bozza=[];sel=null;dest=null}
  render();
}
async function modifica(fn){
  for(let k=0;k<4;k++){
    const ns=JSON.parse(JSON.stringify(stato));fn(ns);
    const{data,error}=await db.from(T).update({stato:ns,versione:versione+1,aggiornato_il:new Date().toISOString()}).eq('codice',codice).eq('versione',versione).select();
    if(error){alert('Errore: '+error.message);return}
    if(data.length){daRiga({versione:versione+1,stato:ns});return}
    await carica();
  }
  alert('Non riesco a salvare, riprova.');
}

/* ---------- regole ---------- */
function risolvi(s){
  const r=s.round,mosse=[],scontri=[],log=[];
  const prima=s.t.a.map((x,i)=>x>0?'a':s.t.b[i]>0?'b':'');
  const A=s.t.a.slice(),B=s.t.b.slice();
  for(const p of['a','b']){
    const arr=p=='a'?A:B;
    for(const o of s.ordini[p]){
      arr[o.da]-=o.n;arr[o.a]+=o.n;
      mosse.push({p,da:o.da,a:o.a,n:o.n});
      log.push(COL[p]+': '+o.n+' da '+nome(o.da)+' a '+nome(o.a));
    }
  }
  if(!mosse.length)log.push('Nessun movimento');
  for(let i=0;i<25;i++){
    if(A[i]>0&&B[i]>0){
      const a0=A[i],b0=B[i],m=Math.min(a0,b0);
      A[i]-=m;B[i]-=m;
      const w=a0>b0?'a':b0>a0?'b':null;
      scontri.push({i,a:a0,b:b0,w});
      log.push('⚔ '+nome(i)+': Blu '+a0+' vs Rosso '+b0+' → '+(w?COL[w]+' resta con '+Math.abs(a0-b0):'casella libera'));
    }
  }
  const cA=A.filter(x=>x>0).length,cB=B.filter(x=>x>0).length;
  const persaA=A[BASE.a]==0&&B[BASE.a]>0,persaB=B[BASE.b]==0&&A[BASE.b]>0;
  let fine=null;
  if(persaA&&persaB)fine={w:null,m:'Entrambe le basi conquistate'};
  else if(persaA)fine={w:'b',m:'Base Blu conquistata'};
  else if(persaB)fine={w:'a',m:'Base Rossa conquistata'};
  else if(r>=MAXR){
    if(cA!=cB)fine={w:cA>cB?'a':'b',m:'Fine round: '+cA+' caselle contro '+cB};
    else{const tA=somma(A),tB=somma(B);fine={w:tA==tB?null:(tA>tB?'a':'b'),m:'Caselle pari ('+cA+'), truppe '+tA+' contro '+tB}}
  }
  if(!fine){
    const ra=1+Math.floor(cA/3),rb=1+Math.floor(cB/3);
    A[BASE.a]+=ra;B[BASE.b]+=rb;
    log.push('Rinforzi: Blu +'+ra+' (base), Rosso +'+rb+' (base)');
    s.round=r+1;
  }else{s.fase='fine';s.vincitore=fine.w;s.motivo=fine.m}
  s.t={a:A,b:B};s.ordini={a:null,b:null};
  s.ultimo={round:r,mosse,scontri,prima};
  s.registro.push({r,righe:log});
  if(s.registro.length>40)s.registro.shift();
}

/* ---------- azioni ---------- */
const inviato=()=>stato.fase=='setup'?stato.setup[ruolo]!=null:stato.fase=='gioco'?stato.ordini[ruolo]!=null:true;
function maxN(){
  if(stato.fase=='setup')return TRUPPE-somma(setupBozza)+setupBozza[sel];
  const altri=bozza.filter(o=>o.da==sel&&o.a!=dest).reduce((x,o)=>x+o.n,0);
  return stato.t[ruolo][sel]-altri;
}
function cella(i){
  if(inviato())return;
  if(i==sel){sel=null;dest=null}
  else if(stato.fase=='setup'){if(inZona(ruolo,i)){sel=i;n=setupBozza[i]}else sel=null}
  else if(stato.fase=='gioco'){
    if(sel!=null&&vicini(sel).includes(i)){dest=i;const e=bozza.find(o=>o.da==sel&&o.a==i);n=e?e.n:Math.min(1,maxN())}
    else if(stato.t[ruolo][i]>0){sel=i;dest=null}
    else{sel=null;dest=null}
  }
  render();
}
function conferma(){
  n=Math.max(0,Math.min(maxN(),Math.floor(+n)||0));
  if(stato.fase=='setup'){setupBozza[sel]=n;sel=null}
  else{bozza=bozza.filter(o=>!(o.da==sel&&o.a==dest));if(n>0)bozza.push({da:sel,a:dest,n});dest=null}
  render();
}
async function inviaSetup(){
  if(somma(setupBozza)!=TRUPPE){alert('Devi piazzare tutte le '+TRUPPE+' truppe');return}
  const arr=setupBozza.slice();
  await modifica(s=>{
    s.setup[ruolo]=arr;
    if(s.setup.a&&s.setup.b){
      s.t={a:s.setup.a,b:s.setup.b};s.fase='gioco';s.round=1;s.setup={a:null,b:null};
      s.registro.push({r:0,righe:['Schieramenti rivelati. Parte la campagna.']});
    }
  });
}
async function inviaOrdini(){
  const ord=bozza.map(o=>({da:o.da,a:o.a,n:o.n}));
  sel=null;dest=null;
  await modifica(s=>{
    s.ordini[ruolo]=ord;
    if(s.ordini.a&&s.ordini.b)risolvi(s);
  });
}
async function annullaInvio(){
  const prima=(stato.ordini[ruolo]||[]).map(o=>({...o}));
  await modifica(s=>{
    if(s.fase=='gioco'&&s.ordini[ruolo]&&!(s.ordini.a&&s.ordini.b))s.ordini[ruolo]=null;
    if(s.fase=='setup'&&s.setup[ruolo])s.setup[ruolo]=null;
  });
  if(stato.fase=='gioco'){bozza=prima;render()}
}
function esci(){clearInterval(timer);codice=null;ruolo=null;stato=null;versione=-1;history.replaceState(null,'','#');render()}

/* ---------- grafica ---------- */
function freccia(da,a,p,num,tratteggio,off){
  const x1=da%5+.5,y1=Math.floor(da/5)+.5,x2=a%5+.5,y2=Math.floor(a/5)+.5;
  const dx=x2-x1,dy=y2-y1,px=-dy*off,py=dx*off;
  const sx=x1+dx*.3+px,sy=y1+dy*.3+py,ex=x1+dx*.78+px,ey=y1+dy*.78+py;
  const col=p=='a'?'#6aa8ff':'#ff7b7b';
  return '<line x1="'+sx+'" y1="'+sy+'" x2="'+ex+'" y2="'+ey+'" stroke="'+col+'" stroke-width=".07" '+(tratteggio?'stroke-dasharray=".1 .08" ':'')+'marker-end="url(#h'+p+')"/>'+
    '<text x="'+(x1+dx*.45+px*2.4)+'" y="'+(y1+dy*.45+py*2.4+.08)+'" font-size=".24" fill="#fff" text-anchor="middle" font-weight="700">'+num+'</text>';
}
function svgFrecce(){
  let h='<svg class="ov" viewBox="0 0 5 5"><defs>'+
    '<marker id="ha" viewBox="0 0 4 4" refX="3" refY="2" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L4,2L0,4z" fill="#6aa8ff"/></marker>'+
    '<marker id="hb" viewBox="0 0 4 4" refX="3" refY="2" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L4,2L0,4z" fill="#ff7b7b"/></marker></defs>';
  if(stato.ultimo&&stato.fase!='setup')for(const m of stato.ultimo.mosse)h+=freccia(m.da,m.a,m.p,m.n,false,m.p=='a'?.07:-.07);
  if(stato.fase=='gioco')for(const o of bozza)h+=freccia(o.da,o.a,ruolo,o.n,true,0);
  return h+'</svg>';
}
const owner=(s,i)=>s.t.a[i]>0?'a':s.t.b[i]>0?'b':'';
function punteggio(s){
  const q=p=>{const arr=s.t[p],c=arr.filter(x=>x>0).length;return{c,t:somma(arr),r:1+Math.floor(c/3)}};
  const box=(p,x)=>'<div class="'+p+'"><b>'+COL[p]+(ruolo==p?' (tu)':'')+'</b><br>'+x.c+' caselle · '+x.t+' truppe<br>rinforzo a fine round: +'+x.r+'</div>';
  return '<div class="score">'+box('a',q('a'))+box('b',q('b'))+'</div>';
}
function esitoHtml(s){
  const u=s.ultimo;if(!u||!u.prima)return'';
  const me=ruolo,op=me=='a'?'b':'a',gain=[],loss=[];
  for(let i=0;i<25;i++){
    const p0=u.prima[i],d0=owner(s,i);
    if(p0!=me&&d0==me)gain.push(nome(i)+(p0==op?' (tolta al nemico)':''));
    else if(p0==me&&d0!=me)loss.push(nome(i)+(d0==op?' (presa dal nemico)':' (rimasta libera)'));
  }
  let h='<div class="esito"><b>Cosa è successo nel round '+u.round+'</b><br>';
  if(gain.length)h+='<span class="g">▲ Conquistate ('+gain.length+'): '+gain.join(', ')+'</span><br>';
  if(loss.length)h+='<span class="p">▼ Perse ('+loss.length+'): '+loss.join(', ')+'</span><br>';
  if(!gain.length&&!loss.length)h+='Nessuna casella ha cambiato proprietario.<br>';
  for(const c of u.scontri){
    const m=me=='a'?c.a:c.b,t=me=='a'?c.b:c.a;
    h+='⚔ '+nome(c.i)+': tu '+m+' vs avversario '+t+' → '+(c.w==me?'vinto, resti con '+(m-t):c.w==null?'pari, casella libera':'perso')+'<br>';
  }
  return h+'</div>';
}
function suggerimento(s){
  if(s.fase=='setup')return sel==null?'<b>Passo 1:</b> tocca una casella evidenziata (le tue due righe) per piazzarci delle truppe. Ancora da piazzare: <b>'+(TRUPPE-somma(setupBozza))+'</b>.':'<b>Passo 2:</b> scrivi quante truppe mettere in <b>'+nome(sel)+'</b> e premi OK.';
  if(sel==null)return bozza.length?'Puoi aggiungere altri ordini (tocca un\'altra tua casella) oppure premere <b>Invia ordini</b>.':'<b>Passo 1:</b> tocca una tua casella con truppe, da cui far partire un movimento. Se non vuoi muovere niente, premi <b>Passa il turno</b>.';
  if(dest==null)return '<b>Passo 2:</b> tocca una casella vicina a <b>'+nome(sel)+'</b> (bordo verde) dove mandare le truppe.';
  return '<b>Passo 3:</b> scrivi quante truppe mandare da <b>'+nome(sel)+'</b> a <b>'+nome(dest)+'</b> e premi OK.';
}
function comeHtml(){
  return '<details class="how" '+(comeOpen?'open':'')+'><summary>Come si gioca</summary>'+
  '<p><b>Obiettivo:</b> conquistare la base nemica (★ nell\'angolo opposto). Dopo '+MAXR+' round vince chi controlla più caselle. Si parte piazzando in segreto '+TRUPPE+' truppe nelle tue due righe.</p>'+
  '<b>Un round:</b><ol>'+
  '<li>Tocca una tua casella con truppe (si evidenzia di bianco).</li>'+
  '<li>Tocca una casella vicina (bordo verde): su, giù, destra o sinistra, non in diagonale.</li>'+
  '<li>Scrivi quante truppe mandare e premi OK. Compare una freccia tratteggiata. Puoi dare più ordini, anche dalla stessa casella in direzioni diverse.</li>'+
  '<li>Premi <b>Invia ordini</b> (o <b>Passa il turno</b>). Finché l\'avversario non ha inviato puoi annullare.</li>'+
  '<li>Quando hanno inviato entrambi, il round si risolve da solo: tutti gli ordini vengono eseguiti insieme e vedi cosa è cambiato.</li></ol>'+
  '<b>Regole:</b><ul>'+
  '<li>Una casella è tua se ci sono almeno 1 tue truppe. Se la svuoti, torna libera.</li>'+
  '<li>Le truppe che non muovi restano dove sono.</li>'+
  '<li>Se arrivate sulla stessa casella, le truppe si sottraggono: resta chi ne ha di più, con la differenza. Pari = casella libera.</li>'+
  '<li>Due eserciti che si scambiano di casella si incrociano senza scontrarsi.</li>'+
  '<li>A fine round ricevi sulla tua base +1 truppa, più +1 ogni 3 caselle controllate.</li>'+
  '<li>I numeri sulla mappa sono pubblici: sono segreti solo gli ordini del round in corso.</li></ul>'+
  '<b>Segni sulla mappa:</b><ul>'+
  '<li>★ base · <span style="color:#ffb0b0">−3</span> / <span style="color:#b0ffb0">+3</span> truppe in uscita / in arrivo secondo i tuoi ordini</li>'+
  '<li>frecce piene = mosse dell\'ultimo round · tratteggiate = i tuoi ordini</li>'+
  '<li><span style="color:#4ade80">▲ verde lampeggiante</span> = casella conquistata · <span style="color:#f87171">▼ rosso lampeggiante</span> = casella persa · bordo arancio = scontro</li></ul></details>';
}
function render(){
  const app=document.getElementById('app');
  if(!codice||!stato){
    const c=(location.hash||'').replace('#','');
    app.innerHTML='<div class="lob"><h1>Conquista</h1><button data-a="crea">Nuova partita</button><div class="legenda">oppure entra con il codice</div><input id="cod" maxlength="4" placeholder="CODICE" value="'+(c.length==4?c:'')+'"><button class="s" data-a="unisci">Entra</button></div>';
    return;
  }
  const s=stato,g=s.fase!='setup';
  let h='<div class="bar"><span><b>Conquista</b> · stanza <b>'+codice+'</b></span><span>Sei <b style="color:'+(ruolo=='a'?'#6aa8ff':'#ff7b7b')+'">'+COL[ruolo]+'</b>'+(g&&s.fase!='fine'?' · Round '+s.round+'/'+MAXR:'')+'</span></div>';
  h+=comeHtml();
  let msg='';
  if(s.fase=='fine'){
    msg='<b>'+(s.vincitore==null?'Pareggio':s.vincitore==ruolo?'Hai vinto! 🎉':'Hai perso')+'</b> — '+s.motivo;
  }else if(s.fase=='setup'){
    if(s.setup[ruolo])msg='Schieramento inviato. '+(s.b_presente?'In attesa dell\'avversario…':'Condividi il codice <b>'+codice+'</b> con lo sfidante.');
    else msg='<b>Schieramento iniziale.</b> '+suggerimento(s)+(s.b_presente?'':' · Codice da condividere: <b>'+codice+'</b>');
  }else{
    if(s.ordini[ruolo])msg='<b>Ordini inviati.</b> Quando invia anche l\'avversario il round si risolve da solo e vedrai cosa è cambiato.';
    else msg='<b>Round '+s.round+' di '+MAXR+'.</b> '+suggerimento(s)+(s.ordini[ruolo=='a'?'b':'a']?' <i>L\'avversario ha già inviato.</i>':'');
  }
  h+='<div class="stato">'+msg+'</div>';
  if(g)h+=punteggio(s)+esitoHtml(s);
  // mappa
  h+='<div class="board"><div class="g">';
  const sc=new Set((s.ultimo&&g?s.ultimo.scontri:[]).map(x=>x.i));
  for(let i=0;i<25;i++){
    let ta=0,tb=0;
    if(g){ta=s.t.a[i];tb=s.t.b[i]}else{if(ruolo=='a')ta=setupBozza[i];else tb=setupBozza[i]}
    const tot=ta||tb;
    let cls='c'+(ta>0?' a':tb>0?' b':(!g&&inZona(ruolo,i)?' zona':''));
    if(i==sel)cls+=' sel';
    if(g&&sel!=null&&!dest&&vicini(sel).includes(i)&&!inviato())cls+=' vic';
    if(sc.has(i))cls+=' sc';
    let tag='';
    if(g&&s.ultimo&&s.ultimo.prima){
      const p0=s.ultimo.prima[i],d0=ta>0?'a':tb>0?'b':'';
      if(p0!=ruolo&&d0==ruolo){cls+=' gain';tag='<span class="tag" style="color:#4ade80">▲</span>'}
      else if(p0==ruolo&&d0!=ruolo){cls+=' loss';tag='<span class="tag" style="color:#f87171">▼</span>'}
      if((tag!=='')&&Date.now()<flashFino)cls+=' flash';
    }
    const out=bozza.filter(o=>o.da==i).reduce((x,o)=>x+o.n,0),inn=bozza.filter(o=>o.a==i).reduce((x,o)=>x+o.n,0);
    const star=i==BASE.a?'<span class="st" style="color:#6aa8ff">★</span>':i==BASE.b?'<span class="st" style="color:#ff7b7b">★</span>':'';
    h+='<div class="'+cls+'" data-a="cella" data-i="'+i+'">'+(tot||'')+'<span class="id">'+nome(i)+'</span>'+star+tag+(out?'<span class="o">−'+out+'</span>':'')+(inn?'<span class="i">+'+inn+'</span>':'')+'</div>';
  }
  h+='</div>'+(g?svgFrecce():'')+'</div>';
  // pannello
  if(!inviato()&&sel!=null&&(s.fase=='setup'||dest!=null)){
    h+='<div class="pan"><span>'+(s.fase=='setup'?'<b>'+nome(sel)+'</b> truppe':'<b>'+nome(sel)+' → '+nome(dest)+'</b>')+'</span>'+
      '<button class="s" data-a="meno">−</button><input id="num" type="number" inputmode="numeric" min="0" value="'+n+'"><button class="s" data-a="piu">+</button>'+
      '<button class="s" data-a="tutte">Max ('+maxN()+')</button><button data-a="conferma">OK</button></div>';
  }
  // ordini
  if(s.fase=='gioco'&&!s.ordini[ruolo]){
    if(bozza.length)h+='<div>'+bozza.map((o,k)=>'<span class="chip">'+nome(o.da)+'→'+nome(o.a)+': '+o.n+' <a data-a="rimuovi" data-k="'+k+'" style="cursor:pointer">✕</a></span>').join('')+'</div>';
    h+='<div class="pan"><button data-a="invia">'+(bozza.length?'Invia ordini ('+bozza.length+')':'Passa il turno')+'</button></div>';
  }
  if(s.fase=='setup'&&!s.setup[ruolo])h+='<div class="pan"><button data-a="inviaSetup" '+(somma(setupBozza)==TRUPPE?'':'disabled')+'>Conferma schieramento</button></div>';
  if(s.fase!='fine'&&inviato())h+='<div class="pan"><button class="s" data-a="annulla">Modifica / annulla invio</button></div>';
  if(s.fase=='fine')h+='<div class="pan"><button data-a="esci">Nuova partita</button></div>';
  // registro
  h+='<div class="reg">'+(s.registro.length?s.registro.slice().reverse().map(e=>'<div class="r"><b>'+(e.r?'Round '+e.r:'Inizio')+'</b>'+e.righe.map(x=>'<div>'+x+'</div>').join('')+'</div>').join(''):'Nessuna mossa ancora.')+'</div>';
  const foc=document.activeElement&&document.activeElement.id=='num';
  app.innerHTML=h;
  if(foc){const el=document.getElementById('num');el&&el.focus()}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a=='crea')crea();
  else if(a=='unisci')unisci(document.getElementById('cod').value);
  else if(a=='cella')cella(+t.dataset.i);
  else if(a=='piu'){n=Math.min(maxN(),(+n||0)+1);render()}
  else if(a=='meno'){n=Math.max(0,(+n||0)-1);render()}
  else if(a=='tutte'){n=maxN();render()}
  else if(a=='conferma')conferma();
  else if(a=='rimuovi'){bozza.splice(+t.dataset.k,1);render()}
  else if(a=='invia')inviaOrdini();
  else if(a=='inviaSetup')inviaSetup();
  else if(a=='annulla')annullaInvio();
  else if(a=='esci')esci();
});
document.addEventListener('input',e=>{if(e.target.id=='num')n=e.target.value});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='num')conferma()});

document.addEventListener('toggle',e=>{
  if(e.target.classList&&e.target.classList.contains('how')){comeOpen=e.target.open;if(!comeOpen)localStorage.setItem('conquista:visto','1')}
},true);
const h0=(location.hash||'').replace('#','');
if(h0.length==4&&localStorage.getItem('conquista:'+h0.toUpperCase()))unisci(h0);else render();
</script></body></html>
